services:
  postgres:
    image: postgres:16-alpine
    container_name: artist-map-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: artist_map
      POSTGRES_USER: artist_map
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - artist_map_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artist_map -d artist_map"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artist-map-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artist-map-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  artist_map_postgres:
